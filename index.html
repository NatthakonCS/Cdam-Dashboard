<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>cdam.store7 POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #ffffff; padding-bottom: 90px; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
    .card-bg { background-color: #1a1c23; }
    .accent-green { color: #00e676; }
    .bg-accent-green { background-color: #00e676; }
    .accent-red { color: #ef4444; }
    .bg-accent-red { background-color: #ef4444; }
    .calendar-cell { height: 70px; transition: all 0.3s ease; overflow: hidden; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    .nav-item.active { color: #00e676; }
    ::-webkit-scrollbar { display: none; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
</style>
</head>
<body class="max-w-lg mx-auto">

<!-- Header -->
<div class="p-4 pt-8 sticky top-0 bg-[#0b0c10] z-20 border-b border-gray-800 shadow-md">
    <div class="flex justify-between items-center mb-2 px-2">
        <h1 class="text-xl font-bold tracking-wider">
            CDAM<span class="text-gray-500">.STORE7</span>
        </h1>
        <div id="connection-status" class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></div>
    </div>
</div>

<!-- Main Content -->
<div class="p-4" id="main-content">

    <!-- ================= DASHBOARD VIEW ================= -->
    <div id="view-dashboard" class="view-section">
        <div class="card-bg rounded-2xl p-6 mb-6 shadow-2xl border border-gray-800 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-green-500 to-emerald-400"></div>
            <p class="text-[10px] text-gray-400 font-bold tracking-widest mb-1 uppercase" id="dashboard-total-title">กำไรสุทธิเดือนนี้ (Net Profit)</p>
            <h2 class="text-4xl font-bold text-white mb-4" id="net-profit">฿0</h2>
            <div class="grid grid-cols-2 gap-4 border-t border-gray-800 pt-4">
                <div>
                    <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">ยอดขายรวม</p>
                    <h3 class="text-lg font-bold accent-green" id="total-income">฿0</h3>
                </div>
                <div>
                    <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">รายจ่ายหน้าร้าน</p>
                    <h3 class="text-lg font-bold accent-red" id="total-expense">฿0</h3>
                </div>
            </div>
        </div>

        <div class="card-bg rounded-2xl p-5 mb-6 shadow-lg border border-gray-800">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold tracking-tight">📅 ปฏิทินยอดขาย</h3>
                <span id="month-title" class="text-[10px] font-bold text-[#00e676] bg-[#00e676]/10 px-3 py-1 rounded-full uppercase tracking-widest">...</span>
            </div>
            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-black text-gray-500 mb-2">
                <div>อา.</div><div>จ.</div><div>อ.</div><div>พ.</div><div>พฤ.</div><div>ศ.</div><div>ส.</div>
            </div>
            <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
        </div>
    </div>

    <!-- ================= ADD RECORD VIEW (ตัวหลัก) ================= -->
    <div id="view-add" class="view-section hidden">
        <div class="card-bg rounded-2xl p-6 shadow-lg border border-gray-800 relative">
            
            <!-- Toggle รับ/จ่าย -->
            <div class="flex bg-gray-900 rounded-xl p-1 mb-5 border border-gray-700 relative">
                <div id="toggle-bg" class="absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-accent-green rounded-lg transition-all duration-300"></div>
                <button type="button" id="btn-type-income" class="w-1/2 py-2 text-sm font-bold text-black z-10 rounded-lg cursor-pointer" onclick="setTransactionType('รับ')">รายรับ (Income)</button>
                <button type="button" id="btn-type-expense" class="w-1/2 py-2 text-sm font-bold text-gray-400 z-10 rounded-lg cursor-pointer" onclick="setTransactionType('จ่าย')">รายจ่าย (Expense)</button>
            </div>

            <form id="sales-form" class="space-y-4">
                
                <!-- กล่องถ่ายรูป -->
                <div class="mb-2">
                    <label class="block text-[10px] font-bold text-gray-400 mb-2">📸 ถ่ายรูปเสื้อ / ใบเสร็จ</label>
                    <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-600 rounded-xl cursor-pointer bg-gray-900 hover:border-[#00e676] transition relative overflow-hidden">
                        <div id="upload-placeholder" class="flex flex-col items-center justify-center">
                            <svg class="w-8 h-8 mb-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                            <p class="text-xs text-gray-500 font-bold">แตะเพื่อถ่ายรูป</p>
                        </div>
                        <input type="file" id="imageFile" class="hidden" accept="image/*" capture="environment" onchange="previewFile()" />
                        <img id="previewImage" class="absolute inset-0 w-full h-full object-cover hidden" />
                    </label>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1">รายการสินค้า / รายละเอียด</label>
                    <input type="text" id="detail" required placeholder="เช่น Stussy Hoodie" class="w-full bg-gray-900 text-white rounded-xl p-3 border border-gray-700 outline-none text-sm font-semibold focus:border-[#00e676]">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div id="cost-container">
                        <label class="block text-[10px] font-bold text-gray-400 mb-1">ทุนรับมา (Cost)</label>
                        <input type="number" id="cost" placeholder="0" class="w-full bg-gray-900 text-gray-300 rounded-xl p-3 border border-gray-700 outline-none text-lg font-bold">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 mb-1" id="amount-label">ราคาขาย (Sell)</label>
                        <input type="number" id="amount" required placeholder="0" class="w-full bg-gray-900 text-[#00e676] rounded-xl p-3 border border-gray-700 outline-none text-lg font-bold focus:border-[#00e676]">
                    </div>
                </div>

                <!-- ระบบคำนวณส่วนแบ่งอัจฉริยะ (โชว์เฉพาะตอนรับเงิน) -->
                <div id="split-container" class="bg-gray-900/80 border border-[#00e676]/30 rounded-xl p-4 hidden mt-2">
                    <p class="text-[10px] text-emerald-400 font-bold mb-2 uppercase border-b border-gray-800 pb-2">💡 สรุปส่วนแบ่งรายตัว</p>
                    <div class="flex justify-between items-center text-xs mb-1">
                        <span class="text-gray-400">คืนต้นทุนเข้าร้าน:</span>
                        <span class="font-bold text-white" id="preview-cost">฿0</span>
                    </div>
                    <div class="flex justify-between items-center text-xs mb-2 pb-2 border-b border-gray-800">
                        <span class="text-[#00e676] font-bold">กำไรสุทธิ:</span>
                        <span class="font-black text-[#00e676]" id="preview-profit">฿0</span>
                    </div>
                    <div class="flex justify-between items-center text-[11px]">
                        <span class="text-blue-400">🤝 หุ้นส่วนได้คนละ (÷3):</span>
                        <span class="font-bold text-blue-400" id="preview-share">฿0</span>
                    </div>
                </div>

                <button type="button" class="w-full bg-accent-green text-black font-black uppercase rounded-xl p-4 mt-4 transition-colors" id="submit-btn" onclick="submitData()">
                    บันทึกข้อมูลเข้าระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- ================= HISTORY VIEW ================= -->
    <div id="view-history" class="view-section hidden">
        <h3 class="text-lg font-bold mb-4 px-1 border-b border-gray-800 pb-3">ประวัติรายการล่าสุด</h3>
        <div id="history-list" class="space-y-3 pb-6">
            <div class="text-center text-gray-500 text-sm mt-10">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

</div>

<!-- ================= BOTTOM NAVIGATION ================= -->
<div class="fixed bottom-0 left-0 w-full bg-[#1a1c23] border-t border-gray-800 pb-safe z-50">
    <div class="max-w-lg mx-auto grid grid-cols-3 items-center p-2 px-1">
        <button onclick="switchTab('dashboard')" class="nav-item active flex flex-col items-center justify-center py-2 text-[#00e676]" id="tab-dashboard">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span class="text-[9px] mt-1.5 font-bold uppercase tracking-wide">หน้าหลัก</span>
        </button>
        
        <button onclick="switchTab('add')" class="nav-item flex flex-col items-center justify-center relative text-gray-500" id="tab-add">
            <div class="absolute -top-6 bg-accent-green text-black rounded-full p-3 shadow-[0_0_15px_rgba(0,230,118,0.4)]">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <span class="text-[9px] mt-7 font-bold uppercase tracking-wide">ขาย/จ่าย</span>
        </button>

        <button onclick="switchTab('history')" class="nav-item flex flex-col items-center justify-center py-2 text-gray-500" id="tab-history">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line></svg>
            <span class="text-[9px] mt-1.5 font-bold uppercase tracking-wide">ประวัติ</span>
        </button>
    </div>
</div>

<script>
    // ==========================================
    // ⚠️ เอา Web App URL จาก Apps Script มาวางตรงนี้
    // ==========================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby3ltwzWbyP_ltQqnY6lxMSD47hRIMUaNvZTB-KELL-nEPEoFOj5N3F4MJQzlKaMxI-jQ/exec';
    
    let globalData = [];
    let currentType = 'รับ';
    let base64String = "", fileMimeType = "", fileNameStr = "";
    const currentDate = new Date();

    // ==========================
    // จัดการ Tab & UI
    // ==========================
    function switchTab(tabId) {
        window.scrollTo({ top: 0, behavior: 'instant' });
        document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.nav-item').forEach(el => {
            el.classList.remove('active', 'text-[#00e676]');
            el.classList.add('text-gray-500');
        });
        
        document.getElementById(`view-${tabId}`).classList.remove('hidden');
        const tabBtn = document.getElementById(`tab-${tabId}`);
        tabBtn.classList.add('active', 'text-[#00e676]');
        tabBtn.classList.remove('text-gray-500');

        if(tabId === 'dashboard') renderDashboard();
        if(tabId === 'history') renderHistory();
    }

    function setTransactionType(type) {
        currentType = type;
        const bg = document.getElementById('toggle-bg');
        const btnInc = document.getElementById('btn-type-income');
        const btnExp = document.getElementById('btn-type-expense');
        const submitBtn = document.getElementById('submit-btn');
        const costContainer = document.getElementById('cost-container');
        const amountLabel = document.getElementById('amount-label');
        const amountInput = document.getElementById('amount');
        
        if (type === 'รับ') {
            bg.style.transform = 'translateX(0)';
            bg.className = 'absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-[#00e676] rounded-lg transition-all duration-300';
            btnInc.className = 'w-1/2 py-2 text-sm font-bold text-black z-10 rounded-lg';
            btnExp.className = 'w-1/2 py-2 text-sm font-bold text-gray-400 z-10 rounded-lg';
            submitBtn.innerText = 'บันทึกการขาย';
            submitBtn.className = 'w-full bg-[#00e676] text-black font-black uppercase rounded-xl p-4 mt-4 transition-colors';
            costContainer.style.display = 'block';
            amountLabel.innerText = 'ราคาขาย (Sell)';
            amountInput.className = 'w-full bg-gray-900 text-[#00e676] rounded-xl p-3 border border-gray-700 outline-none text-lg font-bold focus:border-[#00e676]';
        } else {
            bg.style.transform = 'translateX(100%)';
            bg.className = 'absolute top-1 left-1 bottom-1 w-[calc(50%-4px)] bg-[#ef4444] rounded-lg transition-all duration-300';
            btnExp.className = 'w-1/2 py-2 text-sm font-bold text-white z-10 rounded-lg';
            btnInc.className = 'w-1/2 py-2 text-sm font-bold text-gray-400 z-10 rounded-lg';
            submitBtn.innerText = 'บันทึกรายจ่าย';
            submitBtn.className = 'w-full bg-[#ef4444] text-white font-black uppercase rounded-xl p-4 mt-4 transition-colors';
            costContainer.style.display = 'none';
            amountLabel.innerText = 'ยอดเงินที่จ่าย (Pay)';
            amountInput.className = 'w-full bg-gray-900 text-[#ef4444] rounded-xl p-3 border border-gray-700 outline-none text-lg font-bold focus:border-[#ef4444]';
            document.getElementById('split-container').classList.add('hidden');
        }
    }

    // ==========================
    // ระบบคำนวณหุ้นส่วนแบบ Real-time
    // ==========================
    document.getElementById('cost').addEventListener('input', calculateSplit);
    document.getElementById('amount').addEventListener('input', calculateSplit);

    function calculateSplit() {
        if(currentType !== 'รับ') return;
        const cost = Number(document.getElementById('cost').value) || 0;
        const amount = Number(document.getElementById('amount').value) || 0;
        const container = document.getElementById('split-container');
        
        if (amount > 0) {
            container.classList.remove('hidden');
            const profit = amount - cost;
            const share = profit / 3;
            
            document.getElementById('preview-cost').innerText = '฿' + cost.toLocaleString();
            document.getElementById('preview-profit').innerText = '฿' + profit.toLocaleString();
            document.getElementById('preview-profit').className = profit >= 0 ? "font-black text-[#00e676]" : "font-black text-[#ef4444]";
            document.getElementById('preview-share').innerText = '฿' + share.toLocaleString(undefined, {minimumFractionDigits: 0, maximumFractionDigits: 2});
        } else {
            container.classList.add('hidden');
        }
    }

    // ==========================
    // ระบบจัดการรูปถ่าย (Camera)
    // ==========================
    function previewFile() {
        const file = document.getElementById('imageFile').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onloadend = function() {
                document.getElementById('previewImage').src = reader.result;
                document.getElementById('previewImage').classList.remove('hidden');
                document.getElementById('upload-placeholder').style.opacity = '0';
                
                base64String = reader.result.split(',')[1];
                fileMimeType = file.type;
                fileNameStr = "cdam_" + Date.now() + "_" + file.name;
            }
            reader.readAsDataURL(file);
        }
    }

    function resetForm() {
        document.getElementById('detail').value = '';
        document.getElementById('cost').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('imageFile').value = '';
        document.getElementById('previewImage').classList.add('hidden');
        document.getElementById('upload-placeholder').style.opacity = '1';
        document.getElementById('split-container').classList.add('hidden');
        base64String = "";
    }

    // ==========================
    // ส่งข้อมูลไป Apps Script
    // ==========================
    function submitData() {
        let detail = document.getElementById('detail').value;
        let amount = document.getElementById('amount').value;
        let cost = currentType === 'รับ' ? document.getElementById('cost').value : 0;

        if (!detail || !amount) {
            Swal.fire({title: 'เดี๋ยวก่อน!', text: 'กรอกรายการกับจำนวนเงินให้ครบก่อนครับ', icon: 'warning', confirmButtonColor: '#00e676', background: '#1a1c23', color: '#fff'});
            return;
        }

        let btn = document.getElementById('submitBtn');
        let originalText = btn.innerText;
        btn.innerHTML = "กำลังส่งข้อมูล... ⏳";
        btn.disabled = true;

        let payload = JSON.stringify({ 
            type: currentType, detail: detail, cost: cost, amount: amount,
            imageBase64: base64String, mimeType: fileMimeType, fileName: fileNameStr
        });

        fetch(SCRIPT_URL, { method: 'POST', body: payload })
        .then(response => response.json())
        .then(result => {
            Swal.fire({title: 'เรียบร้อย!', text: 'บันทึกเข้าระบบแล้ว', icon: 'success', confirmButtonColor: '#00e676', background: '#1a1c23', color: '#fff', timer: 1500});
            resetForm();
            setTransactionType('รับ');
            loadData(); // โหลดข้อมูลใหม่ทันที
        })
        .catch(error => {
            Swal.fire({title: 'ส่งข้อมูลแล้ว!', text: 'บันทึกสำเร็จ', icon: 'success', confirmButtonColor: '#00e676', background: '#1a1c23', color: '#fff'});
            resetForm();
            loadData();
        })
        .finally(() => {
            btn.innerHTML = "บันทึกการขาย";
            btn.disabled = false;
        });
    }

    // ==========================
    // โหลดข้อมูล Dashboard & History
    // ==========================
    function loadData() {
        const status = document.getElementById('connection-status');
        fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(res => {
            if(res.status === 'success') {
                globalData = res.data; // [{date, type, detail, cost, amount, profit, image}]
                status.classList.replace('bg-yellow-500', 'bg-[#00e676]');
                status.classList.remove('animate-pulse');
                renderDashboard();
            }
        }).catch(err => {
            status.classList.replace('bg-yellow-500', 'bg-red-500');
        });
    }

    function renderDashboard() {
        let incTotal = 0; let expTotal = 0;
        let dailyData = {};
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        globalData.forEach(row => {
            const rowDate = new Date(row.date);
            if (rowDate.getFullYear() === year && rowDate.getMonth() === month) {
                const val = Number(row.amount) || 0;
                const day = rowDate.getDate();
                if (!dailyData[day]) dailyData[day] = { inc: 0, exp: 0 };
                
                if (row.type === 'รับ') { incTotal += val; dailyData[day].inc += val; } 
                else { expTotal += val; dailyData[day].exp += val; }
            }
        });

        document.getElementById('total-income').innerText = '฿' + incTotal.toLocaleString();
        document.getElementById('total-expense').innerText = '฿' + expTotal.toLocaleString();
        document.getElementById('net-profit').innerText = '฿' + (incTotal - expTotal).toLocaleString();
        document.getElementById('net-profit').className = (incTotal - expTotal) >= 0 ? "text-4xl font-bold text-[#00e676] mb-4" : "text-4xl font-bold text-[#ef4444] mb-4";

        renderCalendarUI(year, month, dailyData);
    }

    function renderCalendarUI(year, month, dailyData) {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthNames = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
        
        document.getElementById('month-title').innerText = `${monthNames[month]} ${String(year + 543).slice(-2)}`;

        for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;
        const todayDate = (year === new Date().getFullYear() && month === new Date().getMonth()) ? new Date().getDate() : null;

        for (let day = 1; day <= daysInMonth; day++) {
            const data = dailyData[day] || { inc: 0, exp: 0 };
            const hasData = data.inc > 0 || data.exp > 0;
            let cellStyle = 'border-gray-800';
            if (hasData) cellStyle = data.inc >= data.exp ? 'border-[#00e676]/40 bg-[#00e676]/5' : 'border-[#ef4444]/50 bg-[#ef4444]/10';
            
            let html = `<div class="calendar-cell rounded-lg flex flex-col items-center justify-start py-1 border ${cellStyle}">
                        <span class="text-[11px] mb-auto ${day === todayDate ? 'bg-white text-black w-5 h-5 rounded-full flex items-center justify-center font-bold' : 'text-gray-400 font-semibold'}">${day}</span>`;
            if (data.inc > 0) html += `<span class="text-[#00e676] text-[9px] font-bold mt-1 leading-none w-full text-center truncate">+${(data.inc/1000).toFixed(1)}k</span>`;
            if (data.exp > 0) html += `<span class="text-[#ef4444] text-[9px] font-bold mt-[2px] leading-none w-full text-center truncate">-${(data.exp/1000).toFixed(1)}k</span>`;
            html += `</div>`;
            grid.innerHTML += html;
        }
    }

    function renderHistory() {
        const list = document.getElementById('history-list');
        list.innerHTML = '';
        if(globalData.length === 0) {
            list.innerHTML = '<div class="text-center text-gray-500 text-sm mt-10">ยังไม่มีประวัติการขาย</div>';
            return;
        }
        
        globalData.forEach(item => {
            let isInc = item.type === 'รับ';
            let dateStr = new Date(item.date).toLocaleDateString('th-TH', {month:'short', day:'numeric'});
            
            list.innerHTML += `
            <div class="card-bg border border-gray-800 rounded-2xl p-4 flex justify-between items-center shadow-sm mx-1">
                <div class="flex-1 overflow-hidden pr-3">
                    <p class="text-[10px] text-gray-400 font-bold tracking-wider mb-1">
                        ${dateStr} 
                        ${isInc && item.profit ? `<span class="bg-gray-800 px-2 py-0.5 rounded text-[9px] font-bold text-gray-300 ml-2">กำไร: ฿${Number(item.profit).toLocaleString()}</span>` : ''}
                    </p>
                    <p class="text-sm font-semibold text-gray-200 truncate flex items-center gap-2">
                        ${item.detail} 
                        ${item.image ? `<a href="${item.image}" target="_blank" class="text-blue-400"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg></a>` : ''}
                    </p>
                </div>
                <h3 class="text-lg font-black ${isInc ? 'text-[#00e676]' : 'text-[#ef4444]'}">
                    ${isInc ? '+' : '-'}฿${Number(item.amount).toLocaleString()}
                </h3>
            </div>`;
        });
    }

    // เริ่มการทำงาน
    loadData();
</script>
</body>
</html>
